name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format (informational)
        run: cargo fmt --all -- --check || true

      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets || true

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Package debug binary (always available)
        run: |
          mkdir -p dist
          cp target/debug/adex dist/adex
          chmod +x dist/adex
          tar -czf adex-linux-x64-debug.tar.gz -C dist adex

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: adex-linux-x64-debug
          path: adex-linux-x64-debug.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.artifact }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: adex-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: adex-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: adex-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: adex-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p adex

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/adex"
          test -f "$BIN"
          chmod +x "$BIN"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "target/${{ matrix.target }}/release" adex
          ls -lh "${{ matrix.artifact }}.tar.gz"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/adex.exe"
          if (-not (Test-Path $bin)) { throw "Binary not found: $bin" }
          Compress-Archive -Path $bin -DestinationPath "${{ matrix.artifact }}.zip" -Force
          Get-Item "${{ matrix.artifact }}.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
