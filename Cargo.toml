[workspace]
resolver = "2"
members = [
    "crates/adex-core",
    "crates/adex-gui",
]
default-members = ["crates/adex-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kekih/adex"
homepage = "https://github.com/kekih/adex"
authors = ["kekih"]
keywords = ["android", "scrcpy", "mirroring", "adb", "rust"]
categories = ["multimedia", "command-line-utilities", "gui"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
